name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalog-svc
        uses: actions/checkout@v4
        with:
          repository: jrumandal/catalog-svc
          path: catalog-svc

      - name: Checkout server-shared (sibling workspace)
        uses: actions/checkout@v4
        with:
          repository: jrumandal/server-shared
          path: server-shared

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Link sibling into a workspace
        run: |
          printf 'packages:\n  - "catalog-svc"\n  - "server-shared"\n' > pnpm-workspace.yaml
          printf '{\n  "name": "mf-workspace",\n  "private": true\n}\n' > package.json

      - name: Install
        run: pnpm install

      - name: Build server-shared (prisma generate + tsc)
        working-directory: server-shared
        run: pnpm prisma:generate && pnpm build

      - name: Lint
        working-directory: catalog-svc
        run: pnpm lint

      - name: Typecheck
        working-directory: catalog-svc
        run: pnpm typecheck

      - name: Test
        working-directory: catalog-svc
        run: pnpm test

      - name: Build
        working-directory: catalog-svc
        run: pnpm build
